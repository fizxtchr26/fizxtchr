<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Motion Graph Maker</title>

  <style>
    :root { --ink:#1f2937; --line:#2563eb; --grid:#e5e7eb; --axis:#111827; --bg:#ffffff; }

    * { box-sizing: border-box; }

    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      color:var(--ink);
      background:#f8fafc;
    }

    .wrap { max-width:1200px; margin:16px auto; padding:0 12px; }

    /* Layout: controls left, graphs right */
    .layout { display:grid; gap:14px; }
    @media (min-width: 980px) {
      .layout { grid-template-columns: 380px 1fr; align-items:start; }
    }

    .controls { position:relative; min-width: 0; }
    @media (min-width: 980px) {
      .controlsInner {
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        overflow-x: hidden; /* prevent horizontal scroll */
        padding-right: 6px;
      }
    }
    @media (max-width: 979px) {
      .controlsInner { overflow-x: hidden; }
    }

    /* Compact cards */
    .card {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      padding:12px;
      min-width: 0;
    }

    .title { font-size:20px; font-weight:650; margin:0 0 10px; }

    /* Details sections */
    details { border:1px solid #eef2f7; border-radius:12px; background:#fff; min-width:0; }
    details + details { margin-top:10px; }
    summary {
      cursor:pointer;
      list-style:none;
      padding:10px 10px;
      font-weight:650;
      font-size:13px;
      color:#111827;
    }
    summary::-webkit-details-marker { display:none; }
    .sectionBody { padding:0 10px 10px; min-width:0; }

    /* Inputs & tables: compact + shrink-friendly */
    label { font-size:11px; color:#64748b; display:block; margin-bottom:4px; }

    input[type="number"], select {
      width:100%;
      max-width:100%;
      padding:5px 7px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:13px;
      background:#fff;
      min-width: 0;
    }

    /* Reduce the default spinner footprint a little on some browsers */
    input[type="number"] { line-height: 1.15; }

    .row { display:flex; gap:10px; align-items:center; min-width:0; }
    .grid { display:grid; gap:10px; min-width:0; }
    .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    table {
      width:100%;
      border-collapse: collapse;
      table-layout: fixed; /* keeps content from forcing width */
    }
    th, td {
      padding:6px;
      border-bottom:1px solid #eef2f7;
      font-size:13px;
      vertical-align: middle;
      overflow: hidden; /* avoid width blowouts */
    }
    th { text-align:left; color:#475569; font-weight:650; }
    td:last-child { text-align:right; }

    .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
    button {
      appearance:none;
      border:1px solid #cbd5e1;
      background:#fff;
      color:#111827;
      padding:6px 10px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
      white-space: nowrap;
    }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    button:disabled { opacity:.5; cursor:not-allowed; }

    .muted { color:#64748b; font-size:12px; }
    .divider { height:1px; background:#eef2f7; margin:10px 0; }

    /* Graph column */
    .graphs { min-width:0; }
    .graphs .card { padding:12px; }
    .graphTitle { font-weight:650; font-size:13px; }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="app" class="wrap"></div>

  <script type="text/babel">
    const { useMemo, useRef, useState } = React;

    // Fixed internal sampling rate (no UI)
    const SAMPLES_PER_SECOND = 60;

    // -------------------- PHYSICS CORE --------------------
    function integratePiecewise({ x0, v0, segments, samplesPerSecond = 60 }) {
      const totalT = segments.reduce((s, seg) => s + (+seg.duration || 0), 0);
      const dt = totalT > 0 ? 1 / samplesPerSecond : 0.016;

      const boundaries = [{ t: 0, x: +x0, v: +v0 }];
      let t = 0, x = +x0, v = +v0;

      for (const seg of segments) {
        const dur = +seg.duration || 0;
        const a = +seg.a || 0;
        const xEnd = x + v * dur + 0.5 * a * dur * dur;
        const vEnd = v + a * dur;
        t += dur; x = xEnd; v = vEnd;
        boundaries.push({ t, x, v });
      }

      const evalAt = (tt) => {
        let cum = 0, px = +x0, pv = +v0;
        for (const seg of segments) {
          const dur = +seg.duration || 0;
          const a = +seg.a || 0;
          if (tt <= cum + dur + 1e-12) {
            const tau = tt - cum;
            const x = px + pv * tau + 0.5 * a * tau * tau;
            const v = pv + a * tau;
            return { x, v, a };
          }
          const xEnd = px + pv * dur + 0.5 * a * dur * dur;
          const vEnd = pv + a * dur;
          cum += dur; px = xEnd; pv = vEnd;
        }
        const last = boundaries[boundaries.length - 1];
        return { x: last.x, v: last.v, a: 0 };
      };

      const N = Math.max(2, Math.ceil(totalT / dt) + 1);
      const tArr = Array.from({ length: N }, (_, i) => (i * totalT) / (N - 1));
      const xArr = [], vArr = [], aArr = [];
      for (const tt of tArr) {
        const { x, v, a } = evalAt(tt);
        xArr.push(x); vArr.push(v); aArr.push(a);
      }

      const aSteps = [];
      let cum = 0;
      for (const seg of segments) {
        const a = +seg.a || 0, dur = +seg.duration || 0;
        aSteps.push([cum, a], [cum + dur, a]);
        cum += dur;
      }
      return { tArr, xArr, vArr, aArr, aSteps, totalT };
    }

    // -------------------- CHART UTILS --------------------
    function niceStep(raw) {
      const exp = Math.floor(Math.log10(raw));
      const frac = raw / Math.pow(10, exp);
      const niceFrac = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
      return niceFrac * Math.pow(10, exp);
    }

    function makeTicks(min, max, count=5) {
      const span = max - min || 1;
      const step = niceStep(span / count);
      const start = Math.ceil(min / step) * step;
      const ticks = [];
      for (let v = start; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
      return ticks;
    }

    function makeTicksWithStep(min, max, step) {
      const s = Math.abs(+step || 0);
      if (!(s > 0)) return makeTicks(min, max);
      const start = Math.ceil(min / s) * s;
      const ticks = [];
      for (let v = start; v <= max + 1e-9; v += s) ticks.push(+v.toFixed(10));
      return ticks;
    }

    const fmtFixed = (n, dp) => Number(n).toFixed(dp);
    const fmtSmart = (n) => {
      const a = Math.abs(n);
      if (a === 0) return "0";
      if (a >= 1000 || a < 0.01) return n.toExponential(0);
      if (a >= 10) return n.toFixed(0);
      if (a >= 1) return n.toFixed(1);
      return n.toFixed(2);
    };

    function polyPath(points) {
      if (!points.length) return "";
      let d = `M${points[0][0]},${points[0][1]}`;
      for (let i = 1; i < points.length; i++) d += ` L${points[i][0]},${points[i][1]}`;
      return d;
    }

    async function exportSvgToPng(svgEl, filename, width, height) {
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const str = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([str], { type:"image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise(res => { img.onload = res; img.src = url; });

      const canvas = document.createElement("canvas");
      canvas.width = width * 2; canvas.height = height * 2;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(b => {
        const url2 = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = url2; a.download = filename; a.click();
        URL.revokeObjectURL(url2);
        URL.revokeObjectURL(url);
      });
    }

    // -------------------- CHART COMPONENT --------------------
    function Chart({
      data, xLabel, yLabel, title,
      height = 320, width = 560,

      // padding (all or per-side)
      paddingAll = 70, paddingTop = null, paddingRight = null, paddingBottom = null, paddingLeft = null,

      // decimals
      decimalsX = null, decimalsY = null,

      // tick steps
      tickStepX = null, tickStepY = null,

      // fonts & offsets
      TICK_FONT = 14, AXIS_FONT = 18,
      X_TICK_OFFSET = 20, X_LABEL_OFFSET = 10,
      Y_TICK_OFFSET = 12, Y_LABEL_OFFSET = 40,
      Y_LABEL_BASELINE = 40,

      // line widths
      LINE_WIDTH_DATA = 2,
      LINE_WIDTH_AXIS = 1,
      LINE_WIDTH_AXIS_ZERO = 2.5,
      LINE_WIDTH_GRID = 0.8,
      LINE_WIDTH_TICKS = 1,
    }) {
      const svgRef = useRef(null);

      const padT = paddingTop ?? paddingAll;
      const padR = paddingRight ?? paddingAll;
      const padB = paddingBottom ?? paddingAll;
      const basePadL = paddingLeft ?? paddingAll;
      const padL = basePadL + Math.max(0, (Y_LABEL_OFFSET - Y_LABEL_BASELINE));


      const xs = data.map(d => d[0]), ys = data.map(d => d[1]);
      let xmin = Math.min(...xs), xmax = Math.max(...xs);
      let ymin = Math.min(...ys), ymax = Math.max(...ys);
      if (ymin === ymax) { ymin -= 1; ymax += 1; }

      const innerW = width - padL - padR, innerH = height - padT - padB;
      const xTo = x => padL + ((x - xmin) / (xmax - xmin || 1)) * innerW;
      const yTo = y => height - padB - ((y - ymin) / (ymax - ymin || 1)) * innerH;

      const points = data.map(([x,y]) => [xTo(x), yTo(y)]);
      const xTicks = tickStepX ? makeTicksWithStep(xmin, xmax, tickStepX) : makeTicks(xmin, xmax, 6);
      const yTicks = tickStepY ? makeTicksWithStep(ymin, ymax, tickStepY) : makeTicks(ymin, ymax, 5);

      const yZero = (0 >= ymin && 0 <= ymax) ? yTo(0) : (height - padB);
      const fmtX = v => (decimalsX===null ? fmtSmart(v) : fmtFixed(v,decimalsX));
      const fmtY = v => (decimalsY===null ? fmtSmart(v) : fmtFixed(v,decimalsY));

      return (
        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div className="graphTitle">{title}</div>
            <div className="btnrow">
              <button onClick={()=>exportSvgToPng(svgRef.current, `${title}.png`, width, height)}>Download PNG</button>
            </div>
          </div>

          <svg ref={svgRef} width={width} height={height} style={{background:"#fff", borderRadius:12}}>
            {/* axes */}
            <line x1={padL} y1={padT} x2={padL} y2={height-padB} stroke="#111827" strokeWidth={LINE_WIDTH_AXIS} />
            <line x1={padL} y1={(0 >= ymin && 0 <= ymax) ? yTo(0) : (height-padB)} x2={width-padR} y2={(0 >= ymin && 0 <= ymax) ? yTo(0) : (height-padB)} stroke="#111827" strokeWidth={LINE_WIDTH_AXIS_ZERO} />

            {/* grid + ticks */}
            {xTicks.map((tx,i)=>(
              <g key={"xt"+i}>
                <line x1={xTo(tx)} y1={padT} x2={xTo(tx)} y2={height-padB} stroke="#e5e7eb" strokeWidth={LINE_WIDTH_GRID} />
                <line x1={xTo(tx)} y1={height-padB} x2={xTo(tx)} y2={height-padB+6} stroke="#111827" strokeWidth={LINE_WIDTH_TICKS} />
                <text x={xTo(tx)} y={height - padB + X_TICK_OFFSET} fontSize={TICK_FONT} textAnchor="middle" fill="#444">{fmtX(tx)}</text>
              </g>
            ))}
            {yTicks.map((ty,i)=>(
              <g key={"yt"+i}>
                <line x1={padL} y1={yTo(ty)} x2={width-padR} y2={yTo(ty)} stroke="#e5e7eb" strokeWidth={LINE_WIDTH_GRID} />
                <line x1={padL-6} y1={yTo(ty)} x2={padL} y2={yTo(ty)} stroke="#111827" strokeWidth={LINE_WIDTH_TICKS} />
                <text x={padL - Y_TICK_OFFSET} y={yTo(ty)+4} fontSize={TICK_FONT} textAnchor="end" fill="#444">{fmtY(ty)}</text>
              </g>
            ))}

            {/* axis labels */}
            <text
              x={width/2}
              y={height - padB + X_TICK_OFFSET + AXIS_FONT + X_LABEL_OFFSET}
              fontSize={AXIS_FONT}
              textAnchor="middle"
              fill="#333"
            >{xLabel}</text>

            <g transform={`translate(${padL - (Y_TICK_OFFSET + Y_LABEL_OFFSET)}, ${height/2}) rotate(-90)`}>
              <text fontSize={AXIS_FONT} textAnchor="middle" dominantBaseline="central" fill="#333">{yLabel}</text>
            </g>

            {/* data */}
            <path d={polyPath(points)} fill="none" stroke="#2563eb" strokeWidth={LINE_WIDTH_DATA} />
          </svg>
        </div>
      );
    }

    // -------------------- APP --------------------
    function App() {
      // Initial conditions
      const [x0, setX0] = useState(0);
      const [v0, setV0] = useState(2);

      // Time intervals
      const [segments, setSegments] = useState([{ duration: 2, a: 0 }, { duration: 2, a: -1 }, { duration: 1.5, a: 2 }]);

      // Style & spacing
      const [TICK_FONT, setTickFont] = useState(14);
      const [AXIS_FONT, setAxisFont] = useState(18);
      const [X_TICK_OFFSET, setXTickOffset] = useState(20);
      const [X_LABEL_OFFSET, setXLabelOffset] = useState(10);
      const [Y_TICK_OFFSET, setYTickOffset] = useState(12);
      const [Y_LABEL_OFFSET, setYLabelOffset] = useState(26);

      const [useSamePadding, setUseSamePadding] = useState(false);
      const [paddingAll, setPaddingAll] = useState(70);
      const [paddingTop, setPaddingTop] = useState(70);
      const [paddingRight, setPaddingRight] = useState(70);
      const [paddingBottom, setPaddingBottom] = useState(70);
      const [paddingLeft, setPaddingLeft] = useState(70);

      // Line thickness
      const [LINE_WIDTH_DATA, setLwData] = useState(2);
      const [LINE_WIDTH_AXIS, setLwAxis] = useState(1);
      const [LINE_WIDTH_AXIS_ZERO, setLwAxisZero] = useState(2.5);
      const [LINE_WIDTH_GRID, setLwGrid] = useState(0.8);
      const [LINE_WIDTH_TICKS, setLwTicks] = useState(1);

      // Axis label decimals
      const [sameDP, setSameDP] = useState(true);
      const [allDP, setAllDP] = useState('auto');
      const [dpT, setDpT] = useState('auto');
      const [dpX, setDpX] = useState('auto');
      const [dpV, setDpV] = useState('auto');
      const [dpA, setDpA] = useState('auto');
      const dec = v => (v==='auto'?null:parseInt(v,10));
      const decT = sameDP?dec(allDP):dec(dpT);
      const decX = sameDP?dec(allDP):dec(dpX);
      const decV = sameDP?dec(allDP):dec(dpV);
      const decA = sameDP?dec(allDP):dec(dpA);

      // Axis tick steps
      const [autoSteps, setAutoSteps] = useState(true);
      const [tStep, setTStep] = useState("");
      const [xStep, setXStep] = useState("");
      const [vStep, setVStep] = useState("");
      const [aStep, setAStep] = useState("");
      const valOrNull = (s) => {
        const n = Number(s);
        return Number.isFinite(n) && n > 0 ? n : null;
      };
      const stepT = autoSteps ? null : valOrNull(tStep);
      const stepX = autoSteps ? null : valOrNull(xStep);
      const stepV = autoSteps ? null : valOrNull(vStep);
      const stepA = autoSteps ? null : valOrNull(aStep);

      // Data (fixed sampling rate)
      const { tArr, xArr, vArr, aSteps, totalT } = useMemo(() =>
        integratePiecewise({
          x0:+x0||0, v0:+v0||0,
          segments: segments.map(s=>({duration:+s.duration||0,a:+s.a||0})),
          samplesPerSecond: SAMPLES_PER_SECOND
        }), [x0,v0,segments]);

      const xData = tArr.map((t,i)=>[t,xArr[i]]);
      const vData = tArr.map((t,i)=>[t,vArr[i]]);
      const aData = aSteps.length ? aSteps : [[0,0],[Math.max(1,totalT),0]];

      const addSeg = () => setSegments(s => [...s, { duration: 1, a: 0 }]);
      const rmSeg = (i) => setSegments(s => s.filter((_,j)=>j!==i));
      const updSeg = (i, k, v) => setSegments(s => s.map((seg,j)=> j===i ? {...seg,[k]:v} : seg));

      const padProps = useSamePadding
        ? { paddingAll }
        : { paddingAll, paddingTop, paddingRight, paddingBottom, paddingLeft };

      const chartStyleProps = {
        TICK_FONT, AXIS_FONT,
        X_TICK_OFFSET, X_LABEL_OFFSET,
        Y_TICK_OFFSET, Y_LABEL_OFFSET,
        LINE_WIDTH_DATA, LINE_WIDTH_AXIS, LINE_WIDTH_AXIS_ZERO, LINE_WIDTH_GRID, LINE_WIDTH_TICKS
      };

      return (
        <div>
          <div className="title">Motion Graph Maker</div>

          <div className="layout">
            {/* LEFT: CONTROLS */}
            <div className="controls">
              <div className="controlsInner">
                <details open>
                  <summary>Initial Conditions</summary>
                  <div className="sectionBody">
                    <div className="grid grid2">
                      <div>
                        <label>x₀ (m)</label>
                        <input type="number" value={x0} onChange={e=>setX0(e.target.value)} />
                      </div>
                      <div>
                        <label>v₀ (m/s)</label>
                        <input type="number" value={v0} onChange={e=>setV0(e.target.value)} />
                      </div>
                    </div>
                  </div>
                </details>

                <details open>
                  <summary>Time Intervals</summary>
                  <div className="sectionBody">
                    <div className="row" style={{justifyContent:"flex-end"}}>
                      <button className="primary" onClick={addSeg}>+ Add</button>
                    </div>

                    <div style={{marginTop:8}}>
                      <table>
                        <thead>
                          <tr>
                            <th style={{width:"32px"}}>#</th>
                            <th>Δt (s)</th>
                            <th>a (m/s²)</th>
                            <th style={{width:"86px"}}></th>
                          </tr>
                        </thead>
                        <tbody>
                          {segments.map((seg,i)=>(
                            <tr key={i}>
                              <td>{i+1}</td>
                              <td><input type="number" min="0" step="any" value={seg.duration} onChange={e=>updSeg(i,"duration", e.target.value)} /></td>
                              <td><input type="number" step="any" value={seg.a} onChange={e=>updSeg(i,"a", e.target.value)} /></td>
                              <td>
                                <button onClick={()=>rmSeg(i)} disabled={segments.length===1}>Remove</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      <div className="muted" style={{marginTop:8}}>
                        Total time: <b>{Number(totalT).toFixed(decT ?? 2)}</b> s
                      </div>
                    </div>
                  </div>
                </details>

                <details>
                  <summary>Style and Spacing</summary>
                  <div className="sectionBody">
                    <div className="grid grid2">
                      <div><label>Tick font (px)</label><input type="number" min="6" step="1" value={TICK_FONT} onChange={e=>setTickFont(+e.target.value||0)} /></div>
                      <div><label>Axis font (px)</label><input type="number" min="8" step="1" value={AXIS_FONT} onChange={e=>setAxisFont(+e.target.value||0)} /></div>
                      <div><label>X tick offset</label><input type="number" min="0" step="1" value={X_TICK_OFFSET} onChange={e=>setXTickOffset(+e.target.value||0)} /></div>
                      <div><label>X label offset</label><input type="number" min="0" step="1" value={X_LABEL_OFFSET} onChange={e=>setXLabelOffset(+e.target.value||0)} /></div>
                      <div><label>Y tick offset</label><input type="number" min="0" step="1" value={Y_TICK_OFFSET} onChange={e=>setYTickOffset(+e.target.value||0)} /></div>
                      <div><label>Y label offset</label><input type="number" min="0" step="1" value={Y_LABEL_OFFSET} onChange={e=>setYLabelOffset(+e.target.value||0)} /></div>
                    </div>

                    <div className="divider"></div>

                    <div className="row">
                      <input id="samePad" type="checkbox" checked={useSamePadding} onChange={e=>setUseSamePadding(e.target.checked)} />
                      <label htmlFor="samePad" style={{margin:0}}>Use same padding for all sides</label>
                    </div>

                    {useSamePadding ? (
                      <div style={{marginTop:8}}>
                        <label>Padding (all sides, px)</label>
                        <input type="number" min="0" step="1" value={paddingAll} onChange={e=>setPaddingAll(+e.target.value||0)} />
                      </div>
                    ) : (
                      <div className="grid grid4" style={{marginTop:8}}>
                        <div><label>Top</label><input type="number" min="0" step="1" value={paddingTop} onChange={e=>setPaddingTop(+e.target.value||0)} /></div>
                        <div><label>Right</label><input type="number" min="0" step="1" value={paddingRight} onChange={e=>setPaddingRight(+e.target.value||0)} /></div>
                        <div><label>Bottom</label><input type="number" min="0" step="1" value={paddingBottom} onChange={e=>setPaddingBottom(+e.target.value||0)} /></div>
                        <div><label>Left</label><input type="number" min="0" step="1" value={paddingLeft} onChange={e=>setPaddingLeft(+e.target.value||0)} /></div>
                      </div>
                    )}
                  </div>
                </details>

                <details>
                  <summary>Line Thickness</summary>
                  <div className="sectionBody">
                    <div className="grid grid2">
                      <div><label>Data curve</label><input type="number" step="0.1" min="0" value={LINE_WIDTH_DATA} onChange={e=>setLwData(+e.target.value||0)} /></div>
                      <div><label>Axis lines</label><input type="number" step="0.1" min="0" value={LINE_WIDTH_AXIS} onChange={e=>setLwAxis(+e.target.value||0)} /></div>
                      <div><label>y=0 axis</label><input type="number" step="0.1" min="0" value={LINE_WIDTH_AXIS_ZERO} onChange={e=>setLwAxisZero(+e.target.value||0)} /></div>
                      <div><label>Grid lines</label><input type="number" step="0.1" min="0" value={LINE_WIDTH_GRID} onChange={e=>setLwGrid(+e.target.value||0)} /></div>
                      <div><label>Tick marks</label><input type="number" step="0.1" min="0" value={LINE_WIDTH_TICKS} onChange={e=>setLwTicks(+e.target.value||0)} /></div>
                    </div>
                  </div>
                </details>

                <details>
                  <summary>Axis Label Decimals</summary>
                  <div className="sectionBody">
                    <div className="row">
                      <input id="sameDP" type="checkbox" checked={sameDP} onChange={e=>setSameDP(e.target.checked)} />
                      <label htmlFor="sameDP" style={{margin:0}}>Use same decimals for all axes</label>
                    </div>

                    {sameDP ? (
                      <div style={{maxWidth:220, marginTop:8}}>
                        <label>All axes</label>
                        <select value={allDP} onChange={e=>setAllDP(e.target.value)}>
                          <option value="auto">Auto</option><option value="0">0</option><option value="1">1</option>
                          <option value="2">2</option><option value="3">3</option><option value="4">4</option>
                        </select>
                      </div>
                    ) : (
                      <div className="grid grid4" style={{marginTop:8}}>
                        <div><label>t</label><select value={dpT} onChange={e=>setDpT(e.target.value)}><option value="auto">Auto</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
                        <div><label>x</label><select value={dpX} onChange={e=>setDpX(e.target.value)}><option value="auto">Auto</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
                        <div><label>v</label><select value={dpV} onChange={e=>setDpV(e.target.value)}><option value="auto">Auto</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
                        <div><label>a</label><select value={dpA} onChange={e=>setDpA(e.target.value)}><option value="auto">Auto</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
                      </div>
                    )}
                  </div>
                </details>

                <details>
                  <summary>Axis Tick Steps</summary>
                  <div className="sectionBody">
                    <div className="row">
                      <input id="autoSteps" type="checkbox" checked={autoSteps} onChange={e=>setAutoSteps(e.target.checked)} />
                      <label htmlFor="autoSteps" style={{margin:0}}>Use automatic tick steps</label>
                    </div>
                    {!autoSteps && (
                      <div className="grid grid2" style={{marginTop:8}}>
                        <div><label>t step (s)</label><input type="number" step="any" min="0" placeholder="Auto" value={tStep} onChange={e=>setTStep(e.target.value)} /></div>
                        <div><label>x step (m)</label><input type="number" step="any" min="0" placeholder="Auto" value={xStep} onChange={e=>setXStep(e.target.value)} /></div>
                        <div><label>v step (m/s)</label><input type="number" step="any" min="0" placeholder="Auto" value={vStep} onChange={e=>setVStep(e.target.value)} /></div>
                        <div><label>a step (m/s²)</label><input type="number" step="any" min="0" placeholder="Auto" value={aStep} onChange={e=>setAStep(e.target.value)} /></div>
                      </div>
                    )}
                  </div>
                </details>
              </div>
            </div>

            {/* RIGHT: GRAPHS */}
            <div className="graphs">
              <div className="grid" style={{gap:14}}>
                <Chart
                  data={xData}
                  xLabel="time (s)"
                  yLabel="position (m)"
                  title="Position vs Time"
                  decimalsX={decT}
                  decimalsY={decX}
                  tickStepX={stepT}
                  tickStepY={stepX}
                  {...padProps}
                  {...chartStyleProps}
                />
                <Chart
                  data={vData}
                  xLabel="time (s)"
                  yLabel="velocity (m/s)"
                  title="Velocity vs Time"
                  decimalsX={decT}
                  decimalsY={decV}
                  tickStepX={stepT}
                  tickStepY={stepV}
                  {...padProps}
                  {...chartStyleProps}
                />
                <Chart
                  data={aData}
                  xLabel="time (s)"
                  yLabel="acceleration (m/s²)"
                  title="Acceleration vs Time"
                  decimalsX={decT}
                  decimalsY={decA}
                  tickStepX={stepT}
                  tickStepY={stepA}
                  {...padProps}
                  {...chartStyleProps}
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
